name: Build UniWin 0.4.1 Custom UI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout UniWin repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK manager
        shell: bash
        run: |
          set -e
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -n "$SDKMANAGER" || (echo "sdkmanager not found" && exit 1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android build tools
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Clone Winlator runtime
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git runtime-src

      - name: Add UniWin custom launcher
        shell: bash
        run: |
          set -e
          cd runtime-src

          sed -i "s/applicationId 'com.winlator'/applicationId 'com.uniwin.runtime'/" app/build.gradle
          sed -i 's/versionName "11.2"/versionName "0.4.1-custom-ui"/' app/build.gradle
          sed -i 's/versionCode 33/versionCode 41/' app/build.gradle
          sed -i 's/android:authorities="com.winlator.FileProvider"/android:authorities="com.uniwin.runtime.FileProvider"/' app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          pattern = re.compile(
              r'<activity\s+android:name="com\.winlator\.MainActivity".*?</activity>',
              re.DOTALL
          )

          replacement = '''<activity android:name="com.winlator.MainActivity"
              android:theme="@style/AppThemeDark"
              android:exported="false"
              android:screenOrientation="sensor"
              android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation" />

          <activity android:name="com.winlator.UniWinHomeActivity"
              android:theme="@style/AppThemeDark"
              android:exported="true"
              android:screenOrientation="sensor"
              android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation">
              <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>
          </activity>'''

          new_s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"MainActivity manifest block replacement failed: count={count}")

          p.write_text(new_s)
          PY

          cat > app/src/main/java/com/winlator/UniWinHomeActivity.java <<'EOF'
          package com.winlator;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import androidx.documentfile.provider.DocumentFile;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class UniWinHomeActivity extends Activity {
              private static final int PICK_GAME_FOLDER = 4104;
              private TextView gameInfo;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(12, 15, 22));
                  getWindow().setNavigationBarColor(Color.rgb(12, 15, 22));

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(12, 15, 22));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(20), dp(20), dp(28));

                  TextView brand = text("UNIWIN", 30, true, Color.WHITE);
                  TextView tagline = text("Windows games, simplified.", 15, false, Color.rgb(156, 163, 175));
                  tagline.setPadding(0, dp(4), 0, dp(24));
                  root.addView(brand);
                  root.addView(tagline);

                  root.addView(sectionTitle("게임 라이브러리"));

                  LinearLayout card = card();
                  TextView gameTitle = text("게임을 추가하세요", 20, true, Color.WHITE);
                  gameInfo = text("폴더를 선택하면 EXE와 Unity 구성요소를 자동으로 분석합니다.", 14, false, Color.rgb(180, 187, 199));
                  gameInfo.setPadding(0, dp(8), 0, dp(14));

                  Button addGame = button("＋ 게임 폴더 선택");
                  addGame.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION |
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                              Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                      startActivityForResult(intent, PICK_GAME_FOLDER);
                  });

                  Button openRuntime = button("Windows 실행환경 열기");
                  openRuntime.setOnClickListener(v ->
                          startActivity(new Intent(this, MainActivity.class)));

                  card.addView(gameTitle);
                  card.addView(gameInfo);
                  card.addView(addGame);
                  card.addView(space(8));
                  card.addView(openRuntime);
                  root.addView(card);

                  root.addView(space(20));
                  root.addView(sectionTitle("빠른 설정"));

                  LinearLayout quick = card();
                  TextView runtime = text("실행 엔진", 16, true, Color.WHITE);
                  TextView runtimeDesc = text("Wine / Box64 / DXVK 기반 런타임", 13, false, Color.rgb(160, 168, 180));
                  runtimeDesc.setPadding(0, dp(4), 0, dp(12));
                  Button androidSettings = button("앱 설정 열기");
                  androidSettings.setOnClickListener(v -> {
                      Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      i.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  });
                  quick.addView(runtime);
                  quick.addView(runtimeDesc);
                  quick.addView(androidSettings);
                  root.addView(quick);

                  root.addView(space(20));
                  TextView note = text(
                          "0.4: UniWin 전용 홈 UI + 게임 자동 분석 + Winlator 런타임 연결\n" +
                          "다음 단계에서는 선택한 EXE를 원터치 실행으로 연결합니다.",
                          12, false, Color.rgb(120, 128, 142));
                  root.addView(note);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != PICK_GAME_FOLDER || resultCode != RESULT_OK || data == null) return;

                  Uri uri = data.getData();
                  if (uri == null) return;

                  int flags = data.getFlags() &
                          (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                  try {
                      getContentResolver().takePersistableUriPermission(uri, flags);
                  } catch (Exception ignored) {}

                  DocumentFile folder = DocumentFile.fromTreeUri(this, uri);
                  if (folder == null || !folder.isDirectory()) {
                      gameInfo.setText("폴더를 읽지 못했습니다.");
                      return;
                  }

                  List<String> exes = new ArrayList<>();
                  boolean unity = false;
                  boolean il2cpp = false;
                  boolean bepinex = false;
                  boolean doorstop = false;

                  for (DocumentFile f : folder.listFiles()) {
                      String name = f.getName();
                      if (name == null) continue;
                      String low = name.toLowerCase(Locale.ROOT);

                      if (f.isFile() && low.endsWith(".exe")) exes.add(name);
                      if (f.isFile() && low.equals("unityplayer.dll")) unity = true;
                      if (f.isFile() && low.equals("gameassembly.dll")) il2cpp = true;
                      if (f.isDirectory() && low.equals("bepinex")) bepinex = true;
                      if (f.isFile() && (low.equals("doorstop_config.ini") || low.equals("winhttp.dll"))) doorstop = true;
                  }

                  StringBuilder sb = new StringBuilder();
                  sb.append(folder.getName()).append("\n");
                  sb.append(exes.isEmpty() ? "EXE 미감지" : "EXE: " + String.join(", ", exes));
                  sb.append("\n");
                  if (unity) sb.append("Unity ");
                  if (il2cpp) sb.append("• IL2CPP ");
                  if (bepinex) sb.append("• BepInEx ");
                  if (doorstop) sb.append("• Doorstop ");
                  gameInfo.setText(sb.toString().trim());
              }

              private LinearLayout card() {
                  LinearLayout x = new LinearLayout(this);
                  x.setOrientation(LinearLayout.VERTICAL);
                  x.setPadding(dp(18), dp(18), dp(18), dp(18));
                  android.graphics.drawable.GradientDrawable bg = new android.graphics.drawable.GradientDrawable();
                  bg.setColor(Color.rgb(22, 27, 36));
                  bg.setCornerRadius(dp(18));
                  bg.setStroke(dp(1), Color.rgb(48, 55, 68));
                  x.setBackground(bg);
                  return x;
              }

              private TextView sectionTitle(String s) {
                  TextView t = text(s, 14, true, Color.rgb(196, 203, 214));
                  t.setPadding(0, 0, 0, dp(10));
                  return t;
              }

              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  android.graphics.drawable.GradientDrawable bg = new android.graphics.drawable.GradientDrawable();
                  bg.setColor(Color.rgb(50, 70, 110));
                  bg.setCornerRadius(dp(12));
                  b.setBackground(bg);
                  b.setMinHeight(dp(48));
                  return b;
              }

              private TextView text(String s, int sp, boolean bold, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private View space(int h) {
                  View v = new View(this);
                  v.setLayoutParams(new LinearLayout.LayoutParams(1, dp(h)));
                  return v;
              }

              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF

          if ! grep -q 'androidx.documentfile' app/build.gradle; then
            sed -i "/dependencies {/a\\    implementation 'androidx.documentfile:documentfile:1.0.1'" app/build.gradle
          fi

          grep -RIl '>Winlator<' app/src/main/res/values 2>/dev/null | while read -r f; do
            sed -i 's/>Winlator</>UniWin</g' "$f" || true
          done

          cp LICENSE UNIWIN_UPSTREAM_LGPL_LICENSE.txt

      - name: Build UniWin APK
        shell: bash
        run: |
          set -e
          cd runtime-src
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare output
        shell: bash
        run: |
          set -e
          mkdir -p output
          APK="$(find runtime-src/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || (echo "APK not found" && exit 1)
          cp "$APK" output/UniWin-0.4.1-Custom-UI.apk
          cp runtime-src/UNIWIN_UPSTREAM_LGPL_LICENSE.txt output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniWin-0.4.1-custom-ui
          path: output/*
          if-no-files-found: error
          retention-days: 30
