
name: Build UniWin 0.6 Multi Game

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          test -n "$SDKMANAGER" || exit 1

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android tools
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Clone runtime
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/brunodev85/winlator-app.git \
            runtime-src

      - name: Create UniWin
        shell: bash
        run: |
          set -e

          cd runtime-src

          sed -i \
            "s/applicationId 'com.winlator'/applicationId 'com.uniwin.runtime'/" \
            app/build.gradle

          sed -i \
            's/versionCode 33/versionCode 60/' \
            app/build.gradle

          sed -i \
            's/versionName "11.2"/versionName "0.6-multi-game"/' \
            app/build.gradle

          sed -i \
            's/android:authorities="com.winlator.FileProvider"/android:authorities="com.uniwin.runtime.FileProvider"/' \
            app/src/main/AndroidManifest.xml

          sed -i \
            's#"/data/data/com.winlator/storage"#"/data/data/com.uniwin.runtime/storage"#' \
            app/src/main/java/com/winlator/core/AppUtils.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              'android:label="@string/app_name">',
              'android:label="@string/app_name"\n'
              '        android:requestLegacyExternalStorage="true">'
          )

          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java"
          )

          s = p.read_text()

          s = s.replace(
              "import com.winlator.MainActivity;\n",
              ""
          )

          s = s.replace(
              "public static void install(final MainActivity activity)",
              "public static void install(final AppCompatActivity activity)"
          )

          s = s.replace(
              "public static void installIfNeeded(final MainActivity activity)",
              "public static void installIfNeeded(final AppCompatActivity activity)"
          )

          p.write_text(s)
          PY

          if ! grep -q 'androidx.documentfile' app/build.gradle
          then
            sed -i \
              "/dependencies {/a\\    implementation 'androidx.documentfile:documentfile:1.0.1'" \
              app/build.gradle
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          pattern = re.compile(
              r'<activity\s+android:name="com\.winlator\.MainActivity".*?</activity>',
              re.DOTALL
          )

          replacement = '''
          <activity
              android:name="com.winlator.MainActivity"
              android:theme="@style/AppThemeDark"
              android:exported="false"
              android:screenOrientation="sensor"
              android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation" />

          <activity
              android:name="com.winlator.UniWinHomeActivity"
              android:theme="@style/AppThemeDark"
              android:exported="true"
              android:screenOrientation="sensor"
              android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation">

              <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>

          </activity>
          '''

          s2, count = pattern.subn(
              replacement,
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Manifest patch failed"
              )

          p.write_text(s2)
          PY

          cat > app/src/main/java/com/winlator/UniWinHomeActivity.java <<'EOF'

          package com.winlator;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;

          import android.graphics.Color;
          import android.graphics.Typeface;

          import android.net.Uri;

          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;

          import android.provider.DocumentsContract;

          import android.view.View;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.documentfile.provider.DocumentFile;

          import com.winlator.container.Container;
          import com.winlator.container.ContainerManager;
          import com.winlator.container.GraphicsDrivers;

          import com.winlator.core.AppUtils;

          import com.winlator.xenvironment.RootFS;
          import com.winlator.xenvironment.RootFSInstaller;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;


          public class UniWinHomeActivity
                  extends AppCompatActivity {

              private static final int PICK_GAME = 6001;

              private final ExecutorService io =
                      Executors.newSingleThreadExecutor();

              private final Handler main =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private LinearLayout library;

              private TextView engineStatus;

              private Button addGame;

              private final List<GameItem> games =
                      new ArrayList<>();


              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  buildUI();

                  loadLibrary();

                  try {

                      RootFSInstaller.installIfNeeded(
                              this
                      );

                  }
                  catch (Throwable t) {

                      engineStatus.setText(
                              "엔진 오류: "
                                      + t.getClass()
                                      .getSimpleName()
                      );

                  }

                  waitForRuntime();
              }


              private void buildUI() {

                  getWindow()
                          .setStatusBarColor(
                                  Color.rgb(
                                          8,
                                          11,
                                          17
                                  )
                          );

                  ScrollView scroll =
                          new ScrollView(
                                  this
                          );

                  scroll.setBackgroundColor(
                          Color.rgb(
                                  8,
                                  11,
                                  17
                          )
                  );

                  LinearLayout root =
                          new LinearLayout(
                                  this
                          );

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          dp(18),
                          dp(20),
                          dp(18),
                          dp(30)
                  );


                  root.addView(
                          text(
                                  "UNIWIN",
                                  32,
                                  true,
                                  Color.WHITE
                          )
                  );


                  TextView subtitle =
                          text(
                                  "Windows 게임 라이브러리",
                                  14,
                                  false,
                                  Color.rgb(
                                          150,
                                          160,
                                          176
                                  )
                          );

                  subtitle.setPadding(
                          0,
                          dp(4),
                          0,
                          dp(20)
                  );

                  root.addView(
                          subtitle
                  );


                  LinearLayout engine =
                          card();

                  engine.addView(
                          text(
                                  "실행 엔진",
                                  16,
                                  true,
                                  Color.WHITE
                          )
                  );


                  engineStatus =
                          text(
                                  "Wine / Box64 / DXVK 준비 중…",
                                  13,
                                  false,
                                  Color.rgb(
                                          170,
                                          180,
                                          195
                                  )
                          );

                  engineStatus.setPadding(
                          0,
                          dp(6),
                          0,
                          0
                  );

                  engine.addView(
                          engineStatus
                  );

                  root.addView(
                          engine
                  );


                  root.addView(
                          space(15)
                  );


                  addGame =
                          button(
                                  "＋ 게임 추가"
                          );

                  addGame.setEnabled(
                          false
                  );

                  addGame.setOnClickListener(
                          v -> selectGame()
                  );

                  root.addView(
                          addGame
                  );


                  root.addView(
                          space(20)
                  );


                  root.addView(
                          text(
                                  "게임 라이브러리",
                                  18,
                                  true,
                                  Color.WHITE
                          )
                  );


                  library =
                          new LinearLayout(
                                  this
                          );

                  library.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  library.setPadding(
                          0,
                          dp(12),
                          0,
                          0
                  );

                  root.addView(
                          library
                  );


                  scroll.addView(
                          root
                  );

                  setContentView(
                          scroll
                  );

                  refreshLibrary();
              }


              private void waitForRuntime() {

                  final long start =
                          System.currentTimeMillis();

                  final Runnable[] r =
                          new Runnable[1];

                  r[0] = () -> {

                      RootFS rootFS =
                              RootFS.find(
                                      this
                              );

                      if (rootFS.isValid()) {

                          engineStatus.setText(
                                  "준비 완료 · Wine / Box64 / DXVK"
                          );

                          engineStatus.setTextColor(
                                  Color.rgb(
                                          120,
                                          220,
                                          150
                                  )
                          );

                          addGame.setEnabled(
                                  true
                          );

                          return;
                      }


                      if (
                              System.currentTimeMillis()
                                      - start
                                      > 180000
                      ) {

                          engineStatus.setText(
                                  "엔진 초기화 실패 · 앱을 다시 실행하세요"
                          );

                          return;
                      }


                      engineStatus.setText(
                              "첫 실행 환경 설치 중…"
                      );

                      main.postDelayed(
                              r[0],
                              1000
                      );
                  };

                  main.post(
                          r[0]
                  );
              }


              private void selectGame() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT_TREE
                          );

                  i.addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                                  |
                                  Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                  |
                                  Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                                  |
                                  Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                  );

                  startActivityForResult(
                          i,
                          PICK_GAME
                  );
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );


                  if (
                          requestCode
                                  != PICK_GAME
                                  ||
                                  resultCode
                                          != Activity.RESULT_OK
                                  ||
                                  data == null
                  ) {

                      return;
                  }


                  Uri uri =
                          data.getData();

                  if (uri == null) {
                      return;
                  }


                  try {

                      getContentResolver()
                              .takePersistableUriPermission(
                                      uri,
                                      data.getFlags()
                                              &
                                              (
                                                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                                                              |
                                                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                              )
                              );

                  }
                  catch (Exception ignored) {
                  }


                  DocumentFile folder =
                          DocumentFile.fromTreeUri(
                                  this,
                                  uri
                          );


                  if (
                          folder == null
                                  ||
                                  !folder.isDirectory()
                  ) {

                      toast(
                              "게임 폴더를 읽지 못했습니다."
                      );

                      return;
                  }


                  addGame.setEnabled(
                          false
                  );

                  engineStatus.setText(
                          "게임 분석 중…"
                  );


                  io.execute(
                          () -> addSelectedGame(
                                  uri,
                                  folder
                          )
                  );
              }


              private void addSelectedGame(
                      Uri uri,
                      DocumentFile folder
              ) {

                  try {

                      File direct =
                              resolvePrimaryPath(
                                      uri
                              );


                      File root;

                      boolean fastMode =
                              direct != null
                                      &&
                                      direct.isDirectory()
                                      &&
                                      direct.canRead();


                      if (fastMode) {

                          root =
                                  direct;

                      }
                      else {

                          File base =
                                  getExternalFilesDir(
                                          null
                                  );

                          if (base == null) {
                              base =
                                      getFilesDir();
                          }


                          File gamesDir =
                                  new File(
                                          base,
                                          "games"
                                  );

                          gamesDir.mkdirs();


                          String folderName =
                                  folder.getName()
                                          != null
                                          ?
                                          folder.getName()
                                          :
                                          "Game";


                          root =
                                  new File(
                                          gamesDir,
                                          safe(folderName)
                                                  + "-"
                                                  + System.currentTimeMillis()
                                  );

                          root.mkdirs();


                          main.post(
                                  () ->
                                          engineStatus.setText(
                                                  "직접 연결 불가 · 게임 파일 가져오는 중…"
                                          )
                          );


                          copyTree(
                                  folder,
                                  root,
                                  0
                          );
                      }


                      File exe =
                              findBestExe(
                                      root
                              );


                      if (exe == null) {

                          main.post(
                                  () -> {

                                      engineStatus.setText(
                                              "EXE를 찾지 못했습니다."
                                      );

                                      addGame.setEnabled(
                                              true
                                      );
                                  }
                          );

                          return;
                      }


                      GameItem item =
                              new GameItem();

                      item.name =
                              root.getName();

                      if (
                              folder.getName()
                                      != null
                      ) {

                          item.name =
                                  folder.getName();
                      }

                      item.rootPath =
                              root.getAbsolutePath();

                      item.exePath =
                              exe.getAbsolutePath();

                      item.fastMode =
                              fastMode;

                      item.containerId =
                              0;


                      games.add(
                              item
                      );

                      saveLibrary();


                      main.post(
                              () -> {

                                  engineStatus.setText(
                                          fastMode
                                                  ?
                                                  "빠른 연결 완료 · 파일 복사 없음"
                                                  :
                                                  "게임 가져오기 완료"
                                  );

                                  addGame.setEnabled(
                                          true
                                  );

                                  refreshLibrary();
                              }
                      );

                  }
                  catch (Exception e) {

                      main.post(
                              () -> {

                                  engineStatus.setText(
                                          "게임 추가 실패: "
                                                  +
                                                  e.getClass()
                                                          .getSimpleName()
                                  );

                                  addGame.setEnabled(
                                          true
                                  );
                              }
                      );
                  }
              }


              private File resolvePrimaryPath(
                      Uri uri
              ) {

                  try {

                      String id =
                              DocumentsContract
                                      .getTreeDocumentId(
                                              uri
                                      );


                      if (
                              id == null
                                      ||
                                      !id.startsWith(
                                              "primary:"
                                      )
                      ) {

                          return null;
                      }


                      String relative =
                              id.substring(
                                      "primary:"
                                              .length()
                              );


                      File root =
                              Environment
                                      .getExternalStorageDirectory();


                      if (
                              relative.isEmpty()
                      ) {

                          return root;
                      }


                      return new File(
                              root,
                              relative
                      );

                  }
                  catch (Exception e) {

                      return null;
                  }
              }


              private void copyTree(
                      DocumentFile src,
                      File dst,
                      int depth
              ) throws Exception {

                  if (depth > 20) {
                      return;
                  }


                  DocumentFile[] files =
                          src.listFiles();


                  for (
                          DocumentFile item
                                  :
                                  files
                  ) {

                      String name =
                              item.getName();

                      if (name == null) {
                          continue;
                      }


                      File out =
                              new File(
                                      dst,
                                      safe(name)
                              );


                      if (item.isDirectory()) {

                          out.mkdirs();

                          copyTree(
                                  item,
                                  out,
                                  depth + 1
                          );

                      }
                      else if (item.isFile()) {

                          try (
                                  InputStream in =
                                          getContentResolver()
                                                  .openInputStream(
                                                          item.getUri()
                                                  );

                                  FileOutputStream fos =
                                          new FileOutputStream(
                                                  out
                                          )
                          ) {

                              if (in == null) {
                                  continue;
                              }


                              byte[] buffer =
                                      new byte[
                                              4
                                                      *
                                                      1024
                                                      *
                                                      1024
                                              ];


                              int count;


                              while (
                                      (
                                              count =
                                                      in.read(
                                                              buffer
                                                      )
                                      )
                                              > 0
                              ) {

                                  fos.write(
                                          buffer,
                                          0,
                                          count
                                  );
                              }
                          }
                      }
                  }
              }


              private File findBestExe(
                      File root
              ) {

                  List<File> exes =
                          new ArrayList<>();

                  scanExe(
                          root,
                          exes,
                          0
                  );


                  if (exes.isEmpty()) {
                      return null;
                  }


                  for (
                          File f
                                  :
                                  exes
                  ) {

                      String n =
                              f.getName()
                                      .toLowerCase(
                                              Locale.ROOT
                                      );


                      if (
                              n.contains(
                                      "unitycrashhandler"
                              )
                                      ||
                                      n.contains(
                                              "unins"
                                      )
                                      ||
                                      n.contains(
                                              "crashreport"
                                      )
                      ) {

                          continue;
                      }


                      if (
                              f.getParentFile()
                                      != null
                                      &&
                                      f.getParentFile()
                                              .equals(
                                                      root
                                              )
                      ) {

                          return f;
                      }
                  }


                  for (
                          File f
                                  :
                                  exes
                  ) {

                      String n =
                              f.getName()
                                      .toLowerCase(
                                              Locale.ROOT
                                      );


                      if (
                              !n.contains(
                                      "unitycrashhandler"
                              )
                                      &&
                                      !n.contains(
                                              "unins"
                                      )
                      ) {

                          return f;
                      }
                  }


                  return exes.get(
                          0
                  );
              }


              private void scanExe(
                      File dir,
                      List<File> result,
                      int depth
              ) {

                  if (
                          depth > 8
                                  ||
                                  dir == null
                                  ||
                                  !dir.isDirectory()
                  ) {

                      return;
                  }


                  File[] files =
                          dir.listFiles();


                  if (files == null) {
                      return;
                  }


                  for (
                          File f
                                  :
                                  files
                  ) {

                      if (f.isDirectory()) {

                          scanExe(
                                  f,
                                  result,
                                  depth + 1
                          );

                      }
                      else if (
                              f.getName()
                                      .toLowerCase(
                                              Locale.ROOT
                                      )
                                      .endsWith(
                                              ".exe"
                                      )
                      ) {

                          result.add(
                                  f
                          );
                      }
                  }
              }


              private void refreshLibrary() {

                  if (library == null) {
                      return;
                  }


                  library.removeAllViews();


                  if (games.isEmpty()) {

                      TextView empty =
                              text(
                                      "아직 추가된 게임이 없습니다.",
                                      14,
                                      false,
                                      Color.rgb(
                                              140,
                                              150,
                                              165
                                      )
                              );

                      library.addView(
                              empty
                      );

                      return;
                  }


                  for (
                          GameItem game
                                  :
                                  new ArrayList<>(
                                          games
                                  )
                  ) {

                      LinearLayout card =
                              card();


                      card.addView(
                              text(
                                      game.name,
                                      17,
                                      true,
                                      Color.WHITE
                              )
                      );


                      String mode =
                              game.fastMode
                                      ?
                                      "빠른 연결"
                                      :
                                      "복사 모드";


                      TextView info =
                              text(
                                      mode
                                              +
                                              "\n"
                                              +
                                              new File(
                                                      game.exePath
                                              ).getName(),
                                      12,
                                      false,
                                      Color.rgb(
                                              155,
                                              165,
                                              180
                                      )
                              );

                      info.setPadding(
                              0,
                              dp(5),
                              0,
                              dp(12)
                      );

                      card.addView(
                              info
                      );


                      Button play =
                              button(
                                      "▶ 실행"
                              );

                      play.setOnClickListener(
                              v -> runGame(
                                      game
                              )
                      );

                      card.addView(
                              play
                      );


                      card.addView(
                              space(
                                      7
                              )
                      );


                      Button remove =
                              secondaryButton(
                                      "라이브러리에서 제거"
                              );

                      remove.setOnClickListener(
                              v -> {

                                  games.remove(
                                          game
                                  );

                                  saveLibrary();

                                  refreshLibrary();
                              }
                      );

                      card.addView(
                              remove
                      );


                      library.addView(
                              card
                      );

                      library.addView(
                              space(
                                      12
                              )
                      );
                  }
              }


              private void runGame(
                      GameItem game
              ) {

                  File root =
                          new File(
                                  game.rootPath
                          );

                  File exe =
                          new File(
                                  game.exePath
                          );


                  if (
                          !root.isDirectory()
                                  ||
                                  !exe.isFile()
                  ) {

                      toast(
                              "게임 파일을 찾을 수 없습니다."
                      );

                      return;
                  }


                  if (
                          !RootFS.find(
                                  this
                          ).isValid()
                  ) {

                      toast(
                              "Windows 실행환경이 준비되지 않았습니다."
                      );

                      return;
                  }


                  engineStatus.setText(
                          game.name
                                  +
                                  " 실행 준비 중…"
                  );


                  try {

                      ContainerManager manager =
                              new ContainerManager(
                                      this
                              );


                      if (
                              game.containerId > 0
                      ) {

                          Container existing =
                                  manager.getContainerById(
                                          game.containerId
                                  );


                          if (existing != null) {

                              existing.setDrives(
                                      buildDrives(
                                              root
                                      )
                              );

                              existing.setGraphicsDriver(
                                      GraphicsDrivers
                                              .getDefaultDriver(
                                                      this
                                              )
                              );

                              existing.saveData();


                              launch(
                                      game,
                                      existing
                              );

                              return;
                          }
                      }


                      JSONObject data =
                              new JSONObject();


                      data.put(
                              "name",
                              "UniWin - "
                                      +
                                      game.name
                      );


                      data.put(
                              "screenSize",
                              Container
                                      .DEFAULT_SCREEN_SIZE
                      );


                      data.put(
                              "envVars",
                              Container
                                      .DEFAULT_ENV_VARS
                      );


                      data.put(
                              "graphicsDriver",
                              GraphicsDrivers
                                      .getDefaultDriver(
                                              this
                                      )
                      );


                      data.put(
                              "dxwrapper",
                              Container
                                      .DEFAULT_DXWRAPPER
                      );


                      data.put(
                              "audioDriver",
                              Container
                                      .DEFAULT_AUDIO_DRIVER
                      );


                      data.put(
                              "wincomponents",
                              Container
                                      .DEFAULT_WINCOMPONENTS
                      );


                      data.put(
                              "drives",
                              buildDrives(
                                      root
                              )
                      );


                      data.put(
                              "startupSelection",
                              Container
                                      .STARTUP_SELECTION_ESSENTIAL
                      );


                      manager.createContainerAsync(
                              data,
                              container -> {

                                  if (container == null) {

                                      engineStatus.setText(
                                              "컨테이너 생성 실패"
                                      );

                                      return;
                                  }


                                  game.containerId =
                                          container.id;

                                  saveLibrary();

                                  launch(
                                          game,
                                          container
                                  );
                              }
                      );

                  }
                  catch (Exception e) {

                      engineStatus.setText(
                              "실행 준비 오류: "
                                      +
                                      e.getClass()
                                              .getSimpleName()
                      );
                  }
              }


              private String buildDrives(
                      File gameRoot
              ) {

                  return "D:"
                          +
                          gameRoot.getAbsolutePath()
                          +
                          "E:"
                          +
                          AppUtils.INTERNAL_STORAGE;
              }


              private void launch(
                      GameItem game,
                      Container container
              ) {

                  runOnUiThread(
                          () -> {

                              Intent intent =
                                      new Intent(
                                              this,
                                              XServerDisplayActivity.class
                                      );


                              intent.putExtra(
                                      "container_id",
                                      container.id
                              );


                              intent.putExtra(
                                      "exec_path",
                                      game.exePath
                              );


                              engineStatus.setText(
                                      game.name
                                              +
                                              " 실행 중"
                              );


                              startActivity(
                                      intent
                              );
                          }
                  );
              }


              private void loadLibrary() {

                  try {

                      SharedPreferences pref =
                              getSharedPreferences(
                                      "uniwin_library",
                                      MODE_PRIVATE
                              );


                      String raw =
                              pref.getString(
                                      "games",
                                      "[]"
                              );


                      JSONArray arr =
                              new JSONArray(
                                      raw
                              );


                      games.clear();


                      for (
                              int i = 0;
                              i < arr.length();
                              i++
                      ) {

                          JSONObject o =
                                  arr.getJSONObject(
                                          i
                                  );


                          GameItem g =
                                  new GameItem();


                          g.name =
                                  o.optString(
                                          "name"
                                  );

                          g.rootPath =
                                  o.optString(
                                          "root"
                                  );

                          g.exePath =
                                  o.optString(
                                          "exe"
                                  );

                          g.fastMode =
                                  o.optBoolean(
                                          "fast",
                                          false
                                  );

                          g.containerId =
                                  o.optInt(
                                          "container",
                                          0
                                  );


                          if (
                                  !g.exePath.isEmpty()
                          ) {

                              games.add(
                                      g
                              );
                          }
                      }

                  }
                  catch (Exception ignored) {
                  }


                  refreshLibrary();
              }


              private void saveLibrary() {

                  try {

                      JSONArray arr =
                              new JSONArray();


                      for (
                              GameItem g
                                  :
                                  games
                      ) {

                          JSONObject o =
                                  new JSONObject();


                          o.put(
                                  "name",
                                  g.name
                          );

                          o.put(
                                  "root",
                                  g.rootPath
                          );

                          o.put(
                                  "exe",
                                  g.exePath
                          );

                          o.put(
                                  "fast",
                                  g.fastMode
                          );

                          o.put(
                                  "container",
                                  g.containerId
                          );


                          arr.put(
                                  o
                          );
                      }


                      getSharedPreferences(
                              "uniwin_library",
                              MODE_PRIVATE
                      )
                              .edit()
                              .putString(
                                      "games",
                                      arr.toString()
                              )
                              .apply();

                  }
                  catch (Exception ignored) {
                  }
              }


              private String safe(
                      String s
              ) {

                  return s.replaceAll(
                          "[\\\\/:*?\"<>|]",
                          "_"
                  );
              }


