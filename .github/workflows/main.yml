name: Build UniWin Runtime Preview

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout UniWin repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK manager
        shell: bash
        run: |
          set -e
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Clone Winlator runtime source
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git runtime-src

      - name: Apply UniWin preview branding
        shell: bash
        run: |
          set -e
          cd runtime-src

          # Keep the original Java namespace for compatibility, but install as a separate Android app.
          sed -i "s/applicationId 'com.winlator'/applicationId 'com.uniwin.runtime'/" app/build.gradle
          sed -i 's/versionName "11.2"/versionName "0.3-runtime-preview"/' app/build.gradle

          # Change visible app label where the source defines it.
          if grep -RIl 'Winlator' app/src/main/res/values >/tmp/uniwin_string_files 2>/dev/null; then
            while IFS= read -r f; do
              sed -i 's/>Winlator</>UniWin Runtime</g' "$f" || true
            done </tmp/uniwin_string_files
          fi

          # Preserve upstream license in the produced source tree.
          cp LICENSE UNIWIN_UPSTREAM_LGPL_LICENSE.txt

      - name: Build runtime APK
        shell: bash
        run: |
          set -e
          cd runtime-src
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          APK="$(find runtime-src/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" output/UniWin-0.3-Runtime-Preview.apk
          cp runtime-src/UNIWIN_UPSTREAM_LGPL_LICENSE.txt output/

      - name: Upload UniWin runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: UniWin-0.3-runtime-preview
          path: output/*
          if-no-files-found: error
          retention-days: 30
