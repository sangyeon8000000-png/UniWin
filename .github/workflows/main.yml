              private TextView text(
                      String s,
                      int size,
                      boolean bold,
                      int color
              ) {

                  TextView t =
                          new TextView(
                                  this
                          );

                  t.setText(
                          s
                  );

                  t.setTextSize(
                          size
                  );

                  t.setTextColor(
                          color
                  );


                  if (bold) {

                      t.setTypeface(
                              Typeface.DEFAULT_BOLD
                      );
                  }


                  return t;
              }


              private View space(
                      int h
              ) {

                  View v =
                          new View(
                                  this
                          );


                  v.setLayoutParams(
                          new LinearLayout.LayoutParams(
                                  1,
                                  dp(h)
                          )
                  );


                  return v;
              }


              private int dp(
                      int value
              ) {

                  return (int)(
                          value
                                  *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                                  +
                                  0.5f
                  );
              }


              private void toast(
                      String s
              ) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT
                  ).show();
              }


              private static class GameItem {

                  String name;

                  String rootPath;

                  String exePath;

                  boolean fastMode;

                  int containerId;
              }
          }

          EOF


          grep -RIl \
            '>Winlator<' \
            app/src/main/res/values \
            2>/dev/null \
            | while read -r f
          do

            sed -i \
              's/>Winlator</>UniWin</g' \
              "$f" \
              || true

          done


          cp \
            LICENSE \
