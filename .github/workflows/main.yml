      - name: Build APK
        shell: bash
        run: |
          set -e

          cd runtime-src

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK="$(
            find \
              runtime-src/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          test -n "$APK" || exit 1

          cp \
            "$APK" \
            output/UniWin-0.6-Multi-Game.apk

          cp \
            runtime-src/UNIWIN_UPSTREAM_LGPL_LICENSE.txt \
            output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UniWin-0.6-multi-game
          path: output/*
          if-no-files-found: error
          retention-days: 30
