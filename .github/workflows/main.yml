name: Build UniWin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate UniWin Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/uniwin/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'UniWin'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.uniwin.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.uniwin.launcher'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1-mobile'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="UniWin"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#111318</item>
                  <item name="android:statusBarColor">#111318</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/uniwin/launcher/MainActivity.java <<'EOF'
          package com.uniwin.launcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.DocumentsContract;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int PICK_GAME_FOLDER = 1001;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(22), dp(18), dp(22));
                  root.setBackgroundColor(Color.rgb(17, 19, 24));

                  TextView title = new TextView(this);
                  title.setText("UniWin");
                  title.setTextSize(30);
                  title.setTextColor(Color.WHITE);
                  title.setTypeface(null, 1);
                  root.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Windows 게임 폴더 자동 분석기 · 0.1 Mobile");
                  subtitle.setTextSize(15);
                  subtitle.setTextColor(Color.rgb(180, 185, 195));
                  subtitle.setPadding(0, dp(6), 0, dp(20));
                  root.addView(subtitle);

                  Button pick = new Button(this);
                  pick.setText("게임 폴더 선택");
                  pick.setAllCaps(false);
                  pick.setTextSize(17);
                  pick.setOnClickListener(v -> chooseFolder());
                  root.addView(pick, new LinearLayout.LayoutParams(-1, dp(56)));

                  status = new TextView(this);
                  status.setText("게임 폴더를 선택하면 EXE와 Unity / IL2CPP / BepInEx / Doorstop 구성을 검사합니다.\n\n※ 이 0.1 빌드는 분석기이며 Wine/Box64 실행 엔진은 아직 포함하지 않습니다.");
                  status.setTextSize(16);
                  status.setTextColor(Color.WHITE);
                  status.setLineSpacing(0, 1.25f);
                  status.setPadding(0, dp(22), 0, dp(22));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(status);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1f));

                  setContentView(root);
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private void chooseFolder() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION |
                          Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                          Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                  startActivityForResult(intent, PICK_GAME_FOLDER);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_GAME_FOLDER && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri treeUri = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(treeUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception ignored) {}
                      analyzeFolder(treeUri);
                  }
              }

              private void analyzeFolder(Uri treeUri) {
                  status.setText("분석 중...");
                  new Thread(() -> {
                      try {
                          String rootDocId = DocumentsContract.getTreeDocumentId(treeUri);
                          Uri children = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, rootDocId);

                          boolean unity = false;
                          boolean il2cpp = false;
                          boolean bepinex = false;
                          boolean doorstop = false;
                          List<String> exes = new ArrayList<>();
                          List<String> archs = new ArrayList<>();

                          String[] projection = {
                                  DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                                  DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                                  DocumentsContract.Document.COLUMN_MIME_TYPE
                          };

                          try (Cursor c = getContentResolver().query(children, projection, null, null, null)) {
                              if (c != null) {
                                  int idCol = c.getColumnIndex(DocumentsContract.Document.COLUMN_DOCUMENT_ID);
                                  int nameCol = c.getColumnIndex(DocumentsContract.Document.COLUMN_DISPLAY_NAME);
                                  int mimeCol = c.getColumnIndex(DocumentsContract.Document.COLUMN_MIME_TYPE);

                                  while (c.moveToNext()) {
                                      String docId = c.getString(idCol);
                                      String name = c.getString(nameCol);
                                      String mime = c.getString(mimeCol);
                                      if (name == null) continue;
                                      String lower = name.toLowerCase(Locale.ROOT);
                                      boolean isDir = DocumentsContract.Document.MIME_TYPE_DIR.equals(mime);

                                      if (lower.equals("unityplayer.dll") || (isDir && lower.endsWith("_data"))) unity = true;
                                      if (lower.equals("gameassembly.dll")) il2cpp = true;
                                      if (isDir && lower.equals("bepinex")) bepinex = true;
                                      if (lower.equals("doorstop_config.ini") || lower.equals("winhttp.dll")) doorstop = true;

                                      if (!isDir && lower.endsWith(".exe")) {
                                          Uri fileUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, docId);
                                          exes.add(name);
                                          archs.add(readPeArchitecture(fileUri));
                                      }
                                  }
                              }
                          }

                          StringBuilder out = new StringBuilder();
                          out.append("분석 완료\n\n");
                          if (exes.isEmpty()) {
                              out.append("EXE: 발견되지 않음\n");
                          } else {
                              out.append("EXE 발견: ").append(exes.size()).append("개\n");
                              for (int i = 0; i < exes.size(); i++) {
                                  out.append(" • ").append(exes.get(i)).append("  [").append(archs.get(i)).append("]\n");
                              }
                          }
                          out.append("\nEngine: ").append(unity ? "Unity 감지" : "Unity 표시 없음").append("\n");
                          out.append("IL2CPP: ").append(il2cpp ? "감지됨" : "감지 안 됨").append("\n");
                          out.append("BepInEx: ").append(bepinex ? "감지됨" : "감지 안 됨").append("\n");
                          out.append("Doorstop: ").append(doorstop ? "감지됨" : "감지 안 됨").append("\n\n");

                          if (unity && il2cpp) out.append("추천 프로필: Unity IL2CPP\n");
                          else if (unity) out.append("추천 프로필: Unity 일반\n");
                          else out.append("추천 프로필: Windows 일반\n");

                          out.append("\n현재 단계: 게임 분석기\n다음 단계: Wine + Box64 + DXVK 실행 엔진 통합");
                          String result = out.toString();
                          runOnUiThread(() -> status.setText(result));
                      } catch (Exception e) {
                          runOnUiThread(() -> status.setText("분석 실패\n\n" + e.getClass().getSimpleName() + ": " + e.getMessage()));
                      }
                  }).start();
              }

              private String readPeArchitecture(Uri uri) {
                  try (InputStream in = getContentResolver().openInputStream(uri)) {
                      if (in == null) return "unknown";
                      byte[] header = new byte[4096];
                      int total = 0;
                      while (total < header.length) {
                          int n = in.read(header, total, header.length - total);
                          if (n <= 0) break;
                          total += n;
                      }
                      if (total < 64 || header[0] != 'M' || header[1] != 'Z') return "unknown";
                      int pe = (header[0x3c] & 0xff) |
                              ((header[0x3d] & 0xff) << 8) |
                              ((header[0x3e] & 0xff) << 16) |
                              ((header[0x3f] & 0xff) << 24);
                      if (pe < 0 || pe + 6 >= total) return "unknown";
                      if (header[pe] != 'P' || header[pe + 1] != 'E') return "unknown";
                      int machine = (header[pe + 4] & 0xff) | ((header[pe + 5] & 0xff) << 8);
                      if (machine == 0x8664) return "x64";
                      if (machine == 0x014c) return "x86";
                      if (machine == 0xAA64) return "ARM64";
                      return String.format(Locale.ROOT, "0x%04X", machine);
                  } catch (Exception e) {
                      return "unknown";
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniWin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
